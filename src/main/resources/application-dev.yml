# 开发环境配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/health_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # 缓存（开发环境使用内存缓存，生产切换为 Redis）
  cache:
    type: simple

  # Kafka 配置（开发环境禁用，需要时设为 true 并启动 Kafka）
  kafka:
    enabled: false
    bootstrap-servers: localhost:9092

logging:
  level:
    com.health.system: DEBUG
    org.springframework.kafka: INFO
