server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: hospital-system

  # 多环境配置
  profiles:
    active: dev

  # Jackson 日期格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# MyBatis-Plus 配置
mybatis-plus:
  global-config:
    db-config:
      id-type: auto           # 数据库自增ID
      logic-delete-field: deleted  # 全局逻辑删除字段
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true  # 下划线转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发环境SQL日志
  type-aliases-package: com.health.system.entity
  mapper-locations: classpath:mapper/*.xml

# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# JWT 配置
jwt:
  secret: HospitalSystemSecretKey2024ForJWTTokenGeneration
  expiration: 28800  # 8小时（秒）
